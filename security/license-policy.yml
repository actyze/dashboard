# Licence policy for Actyze container images.
#
# Actyze is AGPL-3.0-only. Two questions matter for enterprise review:
#   1. Is anything in the image proprietary (not open source at all)?
#   2. Is anything incompatible with our own AGPL-3.0 distribution?
#
# Note on scope: everything here is a separate program shipped alongside our
# code in a container, not linked into it. Distributing GPL/LGPL OS packages in
# the same image is mere aggregation and does not create a combined work. The
# denied list below is therefore about genuinely non-open-source terms, not
# about ordinary copyleft.

# Blocks the build. Not open source, or terms we will not distribute.
denied:
  - LicenseRef-NVIDIA-Proprietary   # CUDA runtime libs; avoid via CPU-only torch
  - LicenseRef-NVIDIA-Software-License-Agreement
  - BUSL-1.1                        # source-available, not open source
  - SSPL-1.0                        # not OSI-approved
  - Elastic-2.0                     # not OSI-approved
  - Commons-Clause                  # removes the right to sell
  - CC-BY-NC-4.0                    # non-commercial
  - CC-BY-NC-SA-4.0
  - JSON                            # "shall be used for Good, not Evil"
  - LicenseRef-Proprietary
  - LicenseRef-Commercial

# Allowed without comment. OSI-approved and AGPL-3.0 compatible.
allowed:
  - MIT
  - MIT-0
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - BSD-4-Clause
  - ISC
  - 0BSD
  - Python-2.0
  - PSF-2.0
  - Zlib
  - MPL-2.0
  - AGPL-3.0-only        # our own code
  - AGPL-3.0-or-later
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - Unlicense
  - CC0-1.0
  - X11
  - Artistic-2.0
  - BSL-1.0
  - PostgreSQL
  - OpenSSL
  - Unicode-DFS-2016
  - Unicode-3.0

# Packages whose SBOM licence field is empty or unparseable. syft frequently
# reports no licence for Debian base packages and for wheels that declare the
# licence only in a classifier. These are reported, not blocked, because an
# absent field is a metadata gap rather than evidence of a proprietary licence.
# Set fail_on_unknown to true once the reported set has been reviewed.
fail_on_unknown: false
